name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Bash syntax check
        run: |
          bash -n console.sh
          bash -n runtime/install.sh
          bash -n bin/*.sh

      - name: Shellcheck
        run: |
          shellcheck console.sh runtime/install.sh bin/*.sh

      - name: Python syntax check
        run: |
          python -m py_compile bin/user_management_cli.py
          python -m py_compile runtime/auth_proxy.py

      - name: CI smoke contract
        run: |
          chmod +x bin/smoke_test.sh
          ./bin/smoke_test.sh --ci
